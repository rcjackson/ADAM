# TEMPORARY DIAGNOSTIC WORKFLOW -- delete along with scripts/diagnose_trigger.py
# once the test_adaptive_scanning regression is understood.
#
# Runs the same trigger scenario twice on one machine, changing only the pyproj
# version between runs, so any movement in `dist` is attributable to pyproj and
# nothing else (same torch, same weights, same runner, same data).

name: Diagnose trigger regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt
          pip install .

      - name: Downgrade pyproj to the pre-regression version
        run: |
          pip install "pyproj==3.7.2"
          python -c "import pyproj; print('pyproj', pyproj.__version__, 'PROJ', pyproj.proj_version_str)"

      - name: Diagnostic with old pyproj
        run: python scripts/diagnose_trigger.py

      - name: Dump model input at pinned pyproj
        run: python scripts/diagnose_render.py /tmp/img_pinned.npy

      - name: Upgrade pyproj to the suspect version
        run: |
          pip install "pyproj==3.8.0"
          python -c "import pyproj; print('pyproj', pyproj.__version__, 'PROJ', pyproj.proj_version_str)"

      - name: Diagnostic with pyproj 3.8.0 (expected RED configuration)
        run: python scripts/diagnose_trigger.py

      - name: Dump model input at pyproj 3.8.0 and compare
        run: |
          python scripts/diagnose_render.py /tmp/img_380.npy
          echo "===== RENDER DIFF: PROJ 9.5.1 vs 9.8.1 ====="
          python scripts/diagnose_render.py /tmp/img_pinned.npy /tmp/img_380.npy

      - name: Run the actual failing test at pyproj 3.8.0
        continue-on-error: true
        run: pytest tests/test_adaptive_scanning.py -v
